<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 852" width="460" height="852" role="img" aria-labelledby="title desc">
  <title id="title">The aurora sidebar</title>
  <desc id="desc">A preview of the sidebar: project and branch, session title, usage limits, context fill, monthly spend by model, and a running workflow.</desc>
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="0.35" stop-color="#fde68a"/>
      <stop offset="0.7" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>
    <linearGradient id="heat" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="318" y2="0">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="0.55" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="28" y1="0" x2="432" y2="0">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="0.18" stop-color="#fdba74"/>
      <stop offset="0.36" stop-color="#fde68a"/>
      <stop offset="0.54" stop-color="#86efac"/>
      <stop offset="0.72" stop-color="#67e8f9"/>
      <stop offset="0.86" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="28" y1="0" x2="432" y2="0">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>
    <linearGradient id="infinity" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ctxFill"><rect x="28" y="346" width="121" height="8" rx="4"/></clipPath>
    <clipPath id="flowFill"><rect x="28" y="674" width="202" height="8" rx="4"/></clipPath>
    <!-- a running spinner: a quarter arc turning -->
    <g id="spin">
      <path d="M -5 0 A 5 5 0 0 1 0 -5" fill="none" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="459" height="851" rx="16" fill="#0e0e12" stroke="#26262c"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#d4d4d8">

    <!-- header: project, branch, state, age -->
    <text x="28" y="44"><tspan fill="#f9a8d4">◆ </tspan><tspan fill="url(#name)" font-weight="700">my-project</tspan><tspan fill="#7dd3fc">  ⎇ </tspan><tspan>main</tspan></text>
    <text x="432" y="44" text-anchor="end"><tspan fill="#86efac">✓</tspan><tspan fill="#46464f"> · </tspan><tspan fill="#8b8b94">2h 41m</tspan></text>
    <text x="28" y="70"><tspan fill="#fde68a">❯ </tspan><tspan>Refactor the billing worker</tspan></text>
    <text x="432" y="70" text-anchor="end" fill="#8b8b94">4f1c9a02</text>

    <!-- USAGE -->
    <rect x="28" y="109" width="3" height="14" rx="1.5" fill="#fcd34d"/>
    <text x="40" y="120" fill="#b4b4bc" font-weight="700">USAGE</text>
    <line x1="90" y1="115.5" x2="432" y2="115.5" stroke="#46464f"/>

    <text x="28" y="150" fill="#fdba74" font-weight="700">5h</text>
    <g>
      <rect x="80" y="141" width="14" height="10" rx="2.5" fill="url(#heat)"/>
      <rect x="97" y="141" width="14" height="10" rx="2.5" fill="url(#heat)"/>
      <rect x="114" y="141" width="14" height="10" rx="2.5" fill="url(#heat)"/>
      <rect x="131" y="141" width="14" height="10" rx="2.5" fill="url(#heat)"/>
      <rect x="148" y="141" width="14" height="10" rx="2.5" fill="url(#heat)"/>
      <rect x="165" y="141" width="14" height="10" rx="2.5" fill="url(#heat)"/>
      <g fill="none" stroke="#3f3f46">
        <rect x="182.5" y="141.5" width="13" height="9" rx="2.5"/>
        <rect x="199.5" y="141.5" width="13" height="9" rx="2.5"/>
        <rect x="216.5" y="141.5" width="13" height="9" rx="2.5"/>
        <rect x="233.5" y="141.5" width="13" height="9" rx="2.5"/>
        <rect x="250.5" y="141.5" width="13" height="9" rx="2.5"/>
        <rect x="267.5" y="141.5" width="13" height="9" rx="2.5"/>
        <rect x="284.5" y="141.5" width="13" height="9" rx="2.5"/>
        <rect x="301.5" y="141.5" width="13" height="9" rx="2.5"/>
      </g>
    </g>
    <text x="432" y="150" text-anchor="end" fill="#fde68a" font-weight="700">42%</text>
    <text x="80" y="171" fill="#8b8b94">resets in 2h 13m</text>

    <text x="28" y="203" fill="#86efac" font-weight="700">week</text>
    <g>
      <rect x="80" y="194" width="14" height="10" rx="2.5" fill="url(#heat)"/>
      <rect x="97" y="194" width="14" height="10" rx="2.5" fill="url(#heat)"/>
      <rect x="114" y="194" width="14" height="10" rx="2.5" fill="url(#heat)"/>
      <g fill="none" stroke="#3f3f46">
        <rect x="131.5" y="194.5" width="13" height="9" rx="2.5"/>
        <rect x="148.5" y="194.5" width="13" height="9" rx="2.5"/>
        <rect x="165.5" y="194.5" width="13" height="9" rx="2.5"/>
        <rect x="182.5" y="194.5" width="13" height="9" rx="2.5"/>
        <rect x="199.5" y="194.5" width="13" height="9" rx="2.5"/>
        <rect x="216.5" y="194.5" width="13" height="9" rx="2.5"/>
        <rect x="233.5" y="194.5" width="13" height="9" rx="2.5"/>
        <rect x="250.5" y="194.5" width="13" height="9" rx="2.5"/>
        <rect x="267.5" y="194.5" width="13" height="9" rx="2.5"/>
        <rect x="284.5" y="194.5" width="13" height="9" rx="2.5"/>
        <rect x="301.5" y="194.5" width="13" height="9" rx="2.5"/>
      </g>
    </g>
    <text x="432" y="203" text-anchor="end" fill="#86efac" font-weight="700">18%</text>
    <text x="80" y="224" fill="#8b8b94">resets in 3d 4h</text>

    <text x="28" y="256" fill="#f0abfc" font-weight="700">fable</text>
    <text x="80" y="256" fill="#8b8b94">unlimited</text>
    <text x="432" y="259" text-anchor="end" fill="url(#infinity)" font-weight="700" font-size="24">∞</text>

    <!-- CONTEXT -->
    <rect x="28" y="295" width="3" height="14" rx="1.5" fill="#67e8f9"/>
    <text x="40" y="306" fill="#b4b4bc" font-weight="700">CONTEXT</text>
    <line x1="106" y1="301.5" x2="321" y2="301.5" stroke="#46464f"/>
    <text x="432" y="306" text-anchor="end" fill="#8b8b94">Opus 5.5 · 1M</text>

    <text x="28" y="336"><tspan fill="#f4f4f5" font-weight="700">302k</tspan><tspan fill="#8b8b94"> of 1M</tspan></text>
    <text x="432" y="336" text-anchor="end" fill="#86efac" font-weight="700">30%</text>
    <rect x="28" y="346" width="404" height="8" rx="4" fill="#24242a"/>
    <rect x="28" y="346" width="121" height="8" rx="4" fill="url(#rainbow)"/>
    <g clip-path="url(#ctxFill)">
      <rect x="10" y="346" width="18" height="8" fill="url(#glint)">
        <animate attributeName="x" values="10;150;150" keyTimes="0;0.6;1" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- SPEND -->
    <rect x="28" y="391" width="3" height="14" rx="1.5" fill="#fde047"/>
    <text x="40" y="402" fill="#b4b4bc" font-weight="700">SPEND</text>
    <line x1="90" y1="397.5" x2="367" y2="397.5" stroke="#46464f"/>
    <text x="432" y="402" text-anchor="end" fill="#8b8b94">October</text>

    <text x="28" y="432" fill="#d8b4fe">Opus 5.5</text>
    <rect x="128" y="424" width="202" height="8" rx="4" fill="#d8b4fe"/>
    <text x="432" y="432" text-anchor="end">$3,277.75</text>

    <text x="28" y="456" fill="#67e8f9">Fable 5.1</text>
    <rect x="128" y="448" width="32" height="8" rx="4" fill="#67e8f9"/>
    <text x="432" y="456" text-anchor="end">$519.54</text>

    <text x="28" y="480" fill="#fdba74">Sonnet 5.5</text>
    <rect x="128" y="472" width="10" height="8" rx="4" fill="#fdba74"/>
    <text x="432" y="480" text-anchor="end">$150.18</text>

    <text x="28" y="504" fill="#86efac">Haiku 5.5</text>
    <rect x="128" y="496" width="3" height="8" rx="1.5" fill="#86efac"/>
    <text x="432" y="504" text-anchor="end">$0.90</text>

    <text x="28" y="528" fill="#8b8b94">this session</text>
    <text x="432" y="528" text-anchor="end" fill="#8b8b94">$12.26</text>

    <text x="28" y="562" font-weight="700">total</text>
    <text x="432" y="562" text-anchor="end" fill="#f4f4f5" font-weight="700">$3,960.63</text>
    <text x="28" y="584" fill="#8b8b94">30 sessions · API prices</text>

    <!-- WORKFLOW -->
    <rect x="28" y="623" width="3" height="14" rx="1.5" fill="#93c5fd"/>
    <text x="40" y="634" fill="#b4b4bc" font-weight="700">WORKFLOW</text>
    <line x1="114" y1="629.5" x2="375" y2="629.5" stroke="#46464f"/>
    <use href="#spin" x="391" y="630" stroke="#93c5fd">
      <animateTransform attributeName="transform" type="rotate" values="0 391 630;360 391 630" dur="1.1s" repeatCount="indefinite" additive="sum"/>
    </use>
    <text x="432" y="634" text-anchor="end" fill="#93c5fd">live</text>

    <text x="28" y="664" fill="#f4f4f5" font-weight="700">api-scout</text>
    <text x="432" y="664" text-anchor="end" fill="#8b8b94">0:42</text>
    <rect x="28" y="674" width="404" height="8" rx="4" fill="#24242a"/>
    <rect x="28" y="674" width="202" height="8" rx="4" fill="url(#flow)"/>
    <g clip-path="url(#flowFill)">
      <rect x="10" y="674" width="18" height="8" fill="url(#glint)" opacity="0.7">
        <animate attributeName="x" values="10;232;232" keyTimes="0;0.7;1" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="28" y="706"><tspan fill="#86efac">2 done</tspan><tspan fill="#8b8b94"> · </tspan><tspan fill="#93c5fd">2 running</tspan><tspan fill="#8b8b94"> · 0 failed</tspan></text>
    <text x="432" y="706" text-anchor="end">2/4</text>

    <text x="28" y="738"><tspan fill="#86efac">✓ </tspan><tspan>scout:placement</tspan></text>
    <text x="432" y="738" text-anchor="end" fill="#8b8b94">sonnet 38s</text>
    <text x="28" y="762"><tspan fill="#86efac">✓ </tspan><tspan>scout:effort</tspan></text>
    <text x="432" y="762" text-anchor="end" fill="#8b8b94">sonnet 41s</text>

    <use href="#spin" x="33" y="782" stroke="#93c5fd">
      <animateTransform attributeName="transform" type="rotate" values="0 33 782;360 33 782" dur="1.1s" repeatCount="indefinite" additive="sum"/>
    </use>
    <text x="46" y="786" fill="#f4f4f5">scout:workflow</text>
    <text x="432" y="786" text-anchor="end" fill="#bfdbfe">sonnet 0:42</text>

    <use href="#spin" x="33" y="806" stroke="#c4b5fd">
      <animateTransform attributeName="transform" type="rotate" values="90 33 806;450 33 806" dur="1.1s" repeatCount="indefinite" additive="sum"/>
    </use>
    <text x="46" y="810" fill="#f4f4f5">scout:agents</text>
    <text x="432" y="810" text-anchor="end" fill="#bfdbfe">sonnet 0:42</text>
  </g>
</svg>
