<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="title desc">
  <title id="title">chromadock</title>
  <desc id="desc">The aurora sidebar for Claude Code: a wordmark in drifting rainbow light over a night sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07070b"/>
      <stop offset="1" stop-color="#101018"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="0.2" stop-color="#fdba74"/>
      <stop offset="0.4" stop-color="#fde68a"/>
      <stop offset="0.6" stop-color="#86efac"/>
      <stop offset="0.8" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#c4b5fd"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.35 0; 0.35 0; -0.35 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#fb923c"/>
      <stop offset="0.4" stop-color="#facc15"/>
      <stop offset="0.6" stop-color="#4ade80"/>
      <stop offset="0.8" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#sky)"/>

    <!-- aurora curtains -->
    <g filter="url(#glow)" opacity="0.55">
      <ellipse cx="260" cy="120" rx="260" ry="70" fill="#22d3ee">
        <animateTransform attributeName="transform" type="translate" values="0 0; 60 18; 0 0" dur="14s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="620" cy="90" rx="300" ry="60" fill="#a78bfa">
        <animateTransform attributeName="transform" type="translate" values="0 0; -70 22; 0 0" dur="17s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="960" cy="140" rx="260" ry="70" fill="#f472b6">
        <animateTransform attributeName="transform" type="translate" values="0 0; -40 -16; 0 0" dur="12s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="460" cy="250" rx="240" ry="50" fill="#4ade80" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0 0; 80 -10; 0 0" dur="19s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="92" cy="54" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="188" cy="270" r="1" opacity="0.5"/>
      <circle cx="402" cy="40" r="1.1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="752" cy="292" r="1" opacity="0.45"/>
      <circle cx="864" cy="46" r="1.3" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="1096" cy="88" r="1" opacity="0.5"/>
      <circle cx="1132" cy="278" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="306" r="0.9" opacity="0.4"/>
      <circle cx="30" cy="180" r="0.9" opacity="0.4"/>
    </g>

    <!-- wordmark: a soft halo under crisp letters -->
    <text x="600" y="178" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#word)" filter="url(#soft)" opacity="0.55">chromadock</text>
    <text x="600" y="178" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#word)">chromadock</text>

    <rect x="390" y="208" width="420" height="2" rx="1" fill="url(#hair)"/>

    <text x="600" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#a1a1aa" letter-spacing="1.5">the aurora sidebar for claude code</text>
  </g>
</svg>
